model:
  win_size: 4
  n_layers: 6
  d_model: 192
  n_heads: 8

training:
  batch_size: 128
  learning_rate: 0.001
  epochs: 40
  warmup_steps: 400
  cosine_decay: true
  weight_decay: 0.1
  augment: true

dataset:
  name: cifar10
  path: data/cifar10
  image_size: 32
  channels: 3

checkpoint_dir: training/vit/checkpoints/cifar10
